version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src/angular"
    schedule:
      interval: "weekly"
    ignore:
      # Angular 22's compiler and typescript-eslint both reject TS 7.x
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # karma-jasmine 5 cannot patch jasmine 7 globals
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
    groups:
      npm_and_yarn:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      root:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/src/python"
    schedule:
      interval: "weekly"
